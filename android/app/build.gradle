apply plugin: 'com.android.application'

// Release signing scaffold (Story 7.6). Real secrets live only in a gitignored
// `keystore.properties` at the Android project root (see keystore.properties.example);
// nothing is committed. When the file is absent — dev machines and CI — the release
// build is simply left unsigned and Gradle does NOT error, so the existing build
// stays green. The moment a developer drops in their keystore + keystore.properties,
// the release build signs via signingConfigs.release.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    // Parse defensively: a malformed keystore.properties (e.g. an unescaped
    // Windows path like storeFile=C:\utils\release.jks — `\u` is a bad unicode
    // escape) makes Properties.load() throw, which would abort Gradle
    // configuration for EVERY build type (including debug/CI). Swallow the parse
    // error and fall through to the unsigned path (hasKeystore stays false).
    try {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    } catch (Exception e) {
        logger.warn("keystore.properties present but could not be parsed (${e.message}); " +
            "release build will be left unsigned.")
        keystoreProperties.clear()
    }
}
// Sign only when the file exists AND every required key is present + non-empty.
// A partially-filled keystore.properties would otherwise feed null into file(...)
// and break configuration for ALL build types (including debug) — so guard on this.
def hasKeystore = keystorePropertiesFile.exists() &&
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { keystoreProperties[it] }

android {
    namespace = "com.wrenbjor.anglewars"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wrenbjor.anglewars"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Populated only when a complete keystore.properties exists; otherwise
            // the release build is unsigned (see the guard on buildTypes.release below).
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only wire the signing config in when a complete keystore is present.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
